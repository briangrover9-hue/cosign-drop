<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Share card</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--paper); }
  .card { box-sizing: border-box; width: 1200px; height: 630px; padding: 64px 72px 56px; display: grid; grid-template-columns: 500px 1fr; grid-template-rows: auto 1fr auto; column-gap: 56px; }
  .kicker { grid-column: 1 / -1; font-family: var(--mono); font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 10px; }
  .score { align-self: center; }
  .num { font-family: var(--serif); font-variation-settings: 'opsz' 72; font-size: 300px; line-height: 0.8; letter-spacing: -0.045em; margin: 0 0 30px; color: var(--ink); }
  .og-stars { width: 370px; height: auto; }
  .text { align-self: center; border-left: 1px solid var(--rule-strong); padding-left: 48px; }
  h1 { font-family: var(--serif); font-variation-settings: 'opsz' 72; font-weight: 500; font-size: 76px; line-height: 0.98; letter-spacing: -0.025em; margin: 0 0 26px; color: var(--ink); }
  .sub { font-family: var(--serif); font-size: 31px; line-height: 1.3; color: var(--ink-2); margin: 0; }
  .foot { grid-column: 1 / -1; display: flex; justify-content: space-between; border-top: 1px solid var(--rule); padding-top: 18px; font-family: var(--mono); font-size: 20px; letter-spacing: 0.06em; color: var(--ink-3); text-transform: uppercase; }
</style></head>
